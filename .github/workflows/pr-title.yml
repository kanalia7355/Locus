name: PR title convention
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYCODE'
          import os, re, sys
          title = os.environ['PR_TITLE']
          pattern = r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .{1,100}$'
          if not re.fullmatch(pattern, title):
              print(f'Invalid PR title: {title!r}')
              sys.exit(1)
          print('Valid Conventional Commits PR title')
          PYCODE
