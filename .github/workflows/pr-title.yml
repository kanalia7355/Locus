name: PR title convention
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore: [main]
# Owner rule (2026-11-09): minimal Actions usage - a new push on the same ref
# supersedes the in-flight run instead of stacking runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYCODE'
          import os, re, sys
          title = os.environ['PR_TITLE']
          pattern = r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .{1,100}$'
          if not re.fullmatch(pattern, title):
              print(f'Invalid PR title: {title!r}')
              sys.exit(1)
          print('Valid Conventional Commits PR title')
          PYCODE
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate actual pushed Conventional Commits
        if: github.event_name == 'push'
        run: python3 scripts/check_commit_subjects.py
