name: Loop engine checks
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  engine:
    # PR-controlled code must not inherit workflow-level publication permissions.
    permissions:
      contents: read
      pull-requests: none
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install engine and pinned development tools
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -e ".[dev]"
      - name: Verify local engine contracts and mocked services
        run: python scripts/verify_loop.py --audit
      # A same-name Actions job is never a trusted independent-review publisher.
      # No model credentials, remote write tokens or merge permissions are available here.
