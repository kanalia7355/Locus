<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="text-scale" content="scale" /><meta name="referrer" content="no-referrer" /><meta name="color-scheme" content="light dark" /><script>try{var savedScheme=localStorage.getItem("locus-theme");var schemeMeta=document.querySelector('meta[name="color-scheme"]');schemeMeta.content=savedScheme==="light"||savedScheme==="dark"||savedScheme==="light dark"?savedScheme:"light dark"}catch(error){/* localStorage が読めない環境（プライベートモード等）では既定の "light dark" のままにする */}</script><title>Locus</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
