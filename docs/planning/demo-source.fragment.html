#research-refined *{box-sizing:border-box}#research-refined .prototype{font-size:12px;color:var(--secondary);padding:4px 0 12px}#research-refined .app{border:1px solid var(--rule);background:var(--page);min-height:780px}#research-refined button,#research-refined input,#research-refined select,#research-refined textarea{font:inherit;color:inherit}#research-refined button{padding:6px 12px;border:1px solid var(--rule);background:var(--page);border-radius:2px}#research-refined button:hover{background:var(--hover)}#research-refined button.primary{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}#research-refined button:focus-visible,#research-refined summary:focus-visible{outline:2px solid var(--strong);outline-offset:3px}#research-refined .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 100px 12px 16px;border-bottom:1px solid var(--rule);min-height:61px}#research-refined .wordmark{font-weight:600;letter-spacing:.06em}#research-refined .meta{font-size:12px;color:var(--secondary)}#research-refined .account{margin-left:auto}#research-refined .shell{display:grid;grid-template-columns:218px minmax(0,1fr);transition:grid-template-columns 220ms ease;min-height:718px}#research-refined .shell.closed{grid-template-columns:0 minmax(0,1fr)}#research-refined .sidebar{overflow:hidden;background:var(--nav);border-right:1px solid var(--rule);visibility:visible;transition:visibility 0s 0s}#research-refined .shell.closed .sidebar{visibility:hidden;transition:visibility 0s 220ms;border:0}#research-refined .navinner{width:217px;padding:19px 12px;transform:translateX(0);transition:transform 220ms ease}#research-refined .closed .navinner{transform:translateX(-30px)}#research-refined .navitem{display:block;width:100%;padding:8px 11px;margin:2px 0;background:transparent;border:0;text-align:left;border-radius:2px}#research-refined .navitem[aria-current=page]{background:var(--hover);font-weight:600;box-shadow:inset 2px 0 var(--strong)}#research-refined .navsection{color:var(--secondary);font-size:12px;margin:8px 10px}#research-refined details{margin:16px 0}#research-refined summary{padding:5px 10px;font-size:12px;color:var(--secondary)}#research-refined .navline{border:0;border-top:1px solid var(--rule);margin:23px 10px}#research-refined main{min-width:0;padding:25px 30px 32px}#research-refined h1{font-size:22px;font-weight:500;margin:0}#research-refined h2{font-size:16px;font-weight:600;margin:0 0 12px}#research-refined h3{font-size:14px;font-weight:600;margin:0 0 8px}#research-refined p{margin:10px 0}#research-refined .pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:20px}#research-refined .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#research-refined .between{justify-content:space-between}#research-refined input:not([type=checkbox]),#research-refined select,#research-refined textarea{background:var(--page);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;max-width:100%}#research-refined label.field{display:grid;gap:6px;margin:14px 0}#research-refined .full{width:100%}#research-refined table{width:100%;border-collapse:collapse;margin:14px 0 22px;table-layout:fixed}#research-refined th{font-size:12px;color:var(--secondary);font-weight:400;text-align:left}#research-refined td,#research-refined th{padding:12px 9px;border-bottom:1px solid var(--rule);vertical-align:top;overflow-wrap:anywhere}#research-refined td:first-child,#research-refined th:first-child{padding-left:0}#research-refined td:last-child,#research-refined th:last-child{padding-right:0}#research-refined .tablelink{border:0;border-bottom:1px solid var(--secondary);padding:0;background:transparent;text-align:left}#research-refined .section{padding:17px 0;border-bottom:1px solid var(--rule)}#research-refined .reading{max-width:880px;margin:auto}#research-refined .question{padding:16px 0;border-bottom:1px solid var(--rule);margin:16px 0 22px}#research-refined .answer{padding-bottom:12px}#research-refined .sources{border-top:1px solid var(--rule);padding:13px 0;margin-top:14px}#research-refined blockquote{border-left:2px solid var(--rule);padding:0 16px;margin:14px 0}#research-refined .compose{margin-top:26px;border:1px solid var(--rule);padding:12px;border-radius:3px}#research-refined .compose textarea{border:0;resize:vertical;min-height:74px;width:100%;padding:2px 0}#research-refined .attachlist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}#research-refined .attachment{display:inline-flex;gap:8px;align-items:center;border-bottom:1px solid var(--rule);padding:4px 0;font-size:12px}#research-refined .attachment button{padding:0 5px}#research-refined .notice{border-left:2px solid var(--strong);background:var(--nav);padding:11px 14px;margin:15px 0;font-size:12px}#research-refined .settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}#research-refined progress{width:100%;height:8px;border:0;accent-color:var(--strong)}#research-refined .excerpt{background:var(--nav);padding:15px;margin:14px 0}#research-refined .steps{display:flex;flex-wrap:wrap;gap:15px;margin:15px 0;font-size:12px;color:var(--secondary)}#research-refined .toolbar{padding:0 0 12px}#research-refined .footnote{font-size:12px;color:var(--secondary);margin-top:20px}#research-refined .path{overflow-wrap:anywhere}#research-refined [hidden]{display:none!important}@media(prefers-reduced-motion:reduce){#research-refined .shell,#research-refined .sidebar,#research-refined .navinner{transition:none}}@media(max-width:720px){#research-refined .shell{grid-template-columns:175px minmax(0,1fr)}#research-refined .navinner{width:174px;padding:12px 6px}#research-refined main{padding:20px 16px}#research-refined .settingsgrid{grid-template-columns:1fr}#research-refined .top{gap:8px}}@media(max-width:520px){#research-refined .shell{grid-template-columns:minmax(0,1fr);min-height:0}#research-refined .sidebar{display:grid;grid-template-rows:1fr;transition:grid-template-rows 220ms ease;border-right:0;border-bottom:1px solid var(--rule)}#research-refined .navinner{width:auto;min-height:0;overflow:hidden;padding:12px}#research-refined .shell.closed{grid-template-columns:minmax(0,1fr)}#research-refined .shell.closed .sidebar{display:grid;grid-template-rows:0fr;visibility:hidden}#research-refined .closed .navinner{padding-top:0;padding-bottom:0;transform:none}#research-refined .top{padding-right:92px}#research-refined .account{margin-left:0}#research-refined .app{min-height:760px}#research-refined .compose .row button{min-height:40px}#research-refined input,#research-refined select,#research-refined textarea{font-size:16px}}
</style>

<style>
#research-refined .app{border-radius:10px;overflow:hidden}#research-refined .top{border-bottom:0}#research-refined .sidebar{border-right:0}#research-refined main.chat-view .pagehead{border-bottom:0;padding-bottom:8px}#research-refined main.chat-view .reading{max-width:760px}#research-refined main.chat-view .question{background:var(--nav);border:0;border-radius:18px 18px 4px 18px;padding:14px 19px;margin:22px 0 26px auto;max-width:85%}#research-refined main.chat-view .question .meta{display:none}#research-refined main.chat-view .compose{border-radius:20px;padding:14px 17px;background:var(--nav);border-color:transparent}#research-refined main.chat-view .compose textarea{background:transparent;min-height:68px;font-size:15px}#research-refined main.chat-view .compose button{border-radius:18px}#research-refined .drop-hint{font-size:12px;color:var(--secondary);padding:4px 0 9px}#research-refined .compose.drag-active{outline:2px dashed var(--strong);outline-offset:4px;background:var(--hover)}#research-refined .compose.drag-active .drop-hint{color:var(--ink);font-weight:600}#research-refined .attachment{background:var(--page);border:1px solid var(--rule);border-radius:9px;padding:7px 10px;max-width:100%;overflow-wrap:anywhere}#research-refined .publication{border-top:1px solid var(--rule);padding-top:24px;margin-top:24px}#research-refined .newchat{margin-bottom:14px}#research-refined .role-preview{background:var(--nav);padding:14px;margin:16px 0}#research-refined .primary{border-radius:6px}

<style>
#research-refined button.icon-button{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;min-height:36px;padding:8px;border:0;background:transparent;border-radius:8px;flex-shrink:0}#research-refined button.icon-button:hover{background:var(--hover)}#research-refined .icon-button svg{width:20px;height:20px;stroke-width:1.6}#research-refined button.icon-send{border-radius:50%!important;background:var(--strong);color:var(--on-strong)}#research-refined button.icon-send:hover{background:var(--strong);opacity:.85}#research-refined .compose.drag-active{outline:none;box-shadow:none;background:var(--nav)}#research-refined .compose,#research-refined .compose:focus-within{outline:none;box-shadow:none}#research-refined .compose textarea:focus{outline:none;box-shadow:none}#research-refined main.chat-view .compose{padding:13px 16px 10px;border:1px solid var(--rule);background:var(--page);border-radius:24px}#research-refined main.chat-view .compose textarea{min-height:62px;resize:none}#research-refined main.chat-view .pagehead h1{font-size:17px}#research-refined main.chat-view .answer>.meta:first-child{display:none}#research-refined main.chat-view .question{max-width:85%}#research-refined .attachment .icon-button{width:24px;height:24px;min-height:24px;padding:4px}#research-refined .attachment .icon-button svg{width:14px;height:14px}@media(pointer:coarse){#research-refined button.icon-button{width:44px;height:44px;min-height:44px}}

<script>
(function(){
const root=document.getElementById('research-refined'),main=root.querySelector('#rr-main'),shell=root.querySelector('#rr-shell'),toggle=root.querySelector('#rr-toggle'),side=root.querySelector('#rr-sidebar');
const state={page:'chat',closed:false,scope:'共有資料＋個人資料',attachments:[],draft:'',question:'成膜条件AとBの違いを、過去の記録から整理して',excerpt:false,done:false,paused:false,toast:'',connection:false,mode:'local',saved:false,chatSent:false,role:'研究者'};
const prior=window.openai?.widgetState?.privateContent;if(prior&&typeof prior.closed==='boolean')state.closed=prior.closed;
const titles={chat:'資料を調べる',shared:'共有資料',personal:'個人資料',history:'調査履歴',users:'利用者',roles:'役割・管理権限',projects:'プロジェクト',connections:'保存先の接続',ingest:'取り込み状況',models:'モデル・同時利用',queue:'実行待ち・負荷',audit:'操作記録',retention:'保存・削除方針'};
function e(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function remember(){window.openai?.setWidgetState?.({modelContent:{screen:titles[state.page],layout:'開閉可能な左メニュー'},privateContent:{closed:state.closed}})?.catch(()=>{});}
function sidebar(){shell.classList.toggle('closed',state.closed);const label=state.closed?'サイドバーを開く':'サイドバーを閉じる';toggle.setAttribute('aria-label',label);toggle.setAttribute('data-tooltip',label);toggle.setAttribute('aria-expanded',String(!state.closed));side.inert=state.closed;}
toggle.addEventListener('click',()=>{state.closed=!state.closed;sidebar();remember();});
function table(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
function head(sub,action=''){return '<div class="pagehead"><div><h1>'+titles[state.page]+'</h1></div>'+action+'</div>';}
function attachments(){return state.attachments.map((f,i)=>'<span class="attachment">'+e(f)+'<button type="button" data-remove="'+i+'" aria-label="'+e(f)+'を添付から外す">×</button></span>').join('');}
function render(){main.classList.toggle('chat-view',state.page==='chat');root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});let h='';
if(state.page==='chat'){
const personal=state.scope==='個人資料のみ',file=personal?'文献調査メモ.pdf':'成膜条件の比較_2026.pdf';
h=head('資料を横断して調べ、出典を確認する')+'<div class="row toolbar"><label class="meta" for="rr-scope">参照範囲</label><select id="rr-scope"><option'+(state.scope==='共有資料＋個人資料'?' selected':'')+'>共有資料＋個人資料</option><option'+(state.scope==='共有資料のみ'?' selected':'')+'>共有資料のみ</option><option'+(personal?' selected':'')+'>個人資料のみ</option></select><span class="meta">この会話の添付資料も参照</span></div><div class="reading"><div class="question"><span class="meta">佐藤 花子</span><p>'+e(state.question)+'</p></div><article class="answer"><div class="meta">資料に基づく整理 / デモ回答</div><h2 style="margin-top:12px">'+(personal?'比較時には試行数の違いも確認が必要です':'条件Bでは膜厚のばらつきが小さい傾向です')+'</h2><p>'+(personal?'個人の調査メモでは、各条件の試行数が揃っていない点が検討課題として挙げられています。':'共有資料の記録では、条件AとBで処理温度と時間が異なります。均一性の比較には、試行数と測定条件も確認する必要があります。')+'</p>'+(!personal?table(['比較項目','条件A','条件B'],[['処理温度','180℃','200℃'],['処理時間','30分','20分']]):'')+'<div class="sources"><span class="meta">出典</span><p><button class="tablelink" data-action="excerpt">'+file+' · p.'+(personal?'2':'12–13')+'</button></p>'+(state.excerpt?'<div class="excerpt"><h3>原文の抜粋（サンプル）</h3><blockquote>'+(personal?'条件間で試行数が異なるため、追加の比較検証を要する。':'条件Bでは、条件Aと比較して膜厚のばらつきが小さかった。')+'</blockquote><span class="meta">'+(personal?'個人資料 / 自分のみ':'共有資料 / 薄膜プロジェクト')+'</span></div>':'')+'</div><div class="meta">自動生成による整理です。判断時には元資料を確認してください。</div></article>'+(state.chatSent?'<div class="notice" role="status">質問と添付をデモ上で受け付けました。回答は固定のサンプルです。ファイル本文は読み取りません。</div>':'')+'<form id="rr-compose" class="compose"><label class="meta" for="rr-draft">続けて調べる</label><textarea id="rr-draft" placeholder="質問を入力">'+e(state.draft)+'</textarea><div class="attachlist" id="rr-attachments">'+attachments()+'</div><div class="row between"><div class="row"><button type="button" data-action="attach">ファイルを添付</button><button type="button" data-action="sample">添付例を試す</button><input type="file" id="rr-files" multiple hidden></div><button class="primary" type="submit">送信</button></div><p class="meta">添付はこの会話で参照。個人資料への登録は別操作です。</p><div class="meta">処理先：'+(state.mode==='local'?'研究室サーバー':'管理者が許可した外部API')+' / 履歴は本人のみ</div></form></div>';
}
if(state.page==='shared'||state.page==='personal'){const personal=state.page==='personal';h=head(personal?'本人のみが参照できる資料':'管理者が接続した保存先から取得した資料',personal?'<button data-action="personalAdd">個人資料を追加（例）</button>':'<button data-page="ingest">更新状況</button>')+'<div class="row between"><span class="meta">'+(personal?'公開範囲：自分のみ':'研究室NAS / 薄膜プロジェクト')+'</span><span class="meta">最終更新 10:42</span></div><label class="field">資料名で絞り込み<input id="rr-filter" placeholder="ファイル名を入力"></label><div id="rr-filetable">'+table(['資料名','保存範囲','状態'],(personal?['文献調査メモ.pdf','解析方針.docx']:['成膜条件の比較_2026.pdf','実験ノート_10月.docx','膜厚測定結果.csv','装置マニュアル.pdf']).map(f=>['<button class="tablelink" data-action="file">'+f+'</button>',personal?'自分のみ':'薄膜プロジェクト','参照可能']))+'</div>'+(state.excerpt?'<div class="excerpt"><h3>資料の確認</h3><p>選択した資料の原文・ページ表示を配置する領域です。</p><span class="meta">このデモでは実際の原本を接続していません。</span></div>':'')+'<p class="footnote">'+(personal?'資料の共有は自動で行いません。':'接続先と公開範囲の変更は管理者が行います。')+'</p>';}
if(state.page==='connections')h=head('共有保存先の接続と公開範囲を設定','<button data-action="connection">接続を追加</button>')+table(['保存先','公開範囲','状態'],[['研究室NAS<div class="meta path">/research/thin-film</div>','薄膜プロジェクト','接続済み'],['オンラインDrive','未設定','未接続']])+(state.connection?'<form id="rr-connect"><h2>接続先の追加</h2><div class="settingsgrid"><label class="field">種類<select><option>NAS / ファイルサーバー</option><option>オンラインDrive（サービス未選定）</option></select></label><label class="field">名称<input value="研究室の共有資料"></label><label class="field">対象フォルダ<input value="/research/thin-film"></label><label class="field">公開範囲<select><option>薄膜プロジェクト</option><option>文献調査プロジェクト</option></select></label></div><button type="submit" class="primary">接続確認（デモ）</button></form>':'')+'<p class="footnote">接続確認後に対象一覧を確認し、取り込みを開始する構成です。</p>';
if(state.page==='ingest')h=head('共有資料の初回処理と差分更新')+(state.done?'<div class="notice" role="status"><h3>取り込みが完了しました</h3>1,240件が参照可能 / 3件は確認が必要です。 <button data-page="shared">資料を開く</button></div>':'')+'<div class="section"><div class="row between"><h2>研究室NAS / 薄膜プロジェクト</h2><span>'+ (state.done?'終了':state.paused?'一時停止':'残り 約18〜26分')+'</span></div><p>'+(state.done?'1,240':'864')+' / 1,243件</p><progress value="'+(state.done?1243:864)+'" max="1243" aria-label="資料取り込みの進捗"></progress><div class="steps"><span>一覧確認 済</span><span>検査 済</span><span>解析・索引化 '+(state.done?'済':'実行中')+'</span></div><p class="meta">残り時間は実測による目安。資料の形式やOCR処理によって変動します。</p><div class="row"><button data-action="pause">'+(state.paused?'再開':'一時停止')+'</button><button data-action="complete">完了通知を試す</button><button data-page="chat">処理済み資料を調べる</button></div></div><div class="section"><h2>確認が必要なファイル</h2>'+table(['ファイル名','理由'],[['旧実験記録.zip','対応形式の対象外'],['共同研究資料.pdf','パスワード保護'],['測定ログ.csv','保存先へのアクセスを確認']])+'</div>';
if(state.page==='models')h=head('処理先の選択と、同時利用時の上限を管理')+'<div class="notice">接続方式・数値は設計例です。実際の処理能力はモデル、サーバー、資料、接続先の制限で検証します。</div><form id="rr-model"><h2>標準の処理先</h2><label class="field">接続方式<select id="rr-modelmode"><option value="local"'+(state.mode==='local'?' selected':'')+'>研究室サーバーのLLM</option><option value="external"'+(state.mode==='external'?' selected':'')+'>外部AIサービスのAPI（許可制）</option></select></label><p class="meta">外部サービスは契約とAPI利用条件を確認して接続します。サブスクリプションの扱いは未確定です。</p><h2 style="margin-top:24px">同時利用の制御</h2><div class="settingsgrid"><label class="field">対話の同時実行上限（例）<input aria-label="対話の同時実行上限" type="number" min="1" value="4"></label><label class="field">一人あたりの同時実行上限（例）<input type="number" min="1" value="1"></label><label class="field">取り込み処理の同時実行上限（例）<input type="number" min="1" value="2"></label><label class="field">待機の上限時間（秒・例）<input type="number" min="1" value="120"></label></div><p>対話を優先し、資料の取り込みは別の待機列で処理します。</p><p class="meta">共有する計算資源にも上限を設けます。処理先を自動で外部へ切り替えません。</p><div class="row"><button class="primary" type="submit">設定を保存（デモ）</button><button type="button" data-page="queue">実行待ちを確認</button></div></form>';
if(state.page==='queue')h=head('混雑時の処理状態を確認')+'<div class="row between"><h2>対話 3件実行中 / 2件待機</h2><button data-action="advance">待機を進める（デモ）</button></div>'+table(['種別','状態','利用範囲'],[['対話','実行中','薄膜プロジェクト'],['対話','待機中 / 順番 1','文献調査プロジェクト'],['資料取り込み','実行中 / 低優先度','薄膜プロジェクト']])+'<p class="footnote">画面例では依頼本文や個人の会話内容を表示していません。混雑時は利用者にも待機状態と取消操作を表示する設計です。</p>';
if(state.page==='roles')h=head('役割を選び、適用範囲と管理権限を確認')+'<label class="field">確認する役割<select id="rr-role">'+['研究者','プロジェクト管理者','システム管理者'].map(r=>'<option'+(r===state.role?' selected':'')+'>'+r+'</option>').join('')+'</select></label>'+table(['操作','実効権限'],[['共有資料の参照','所属プロジェクトの範囲'],['個人資料の登録','本人の資料のみ'],['共有保存先の設定',state.role==='システム管理者'?'許可':'許可されていません'],['利用者・役割の管理',state.role==='研究者'?'許可されていません':state.role==='システム管理者'?'組織内':'担当プロジェクト内']])+'<p class="footnote">役割はデモ用の簡略例です。詳細編集では委任できる範囲を超える権限を付与できない設計にします。</p>';
if(state.page==='users')h=head('所属・役割・利用状態を確認')+table(['利用者','役割','状態'],[['佐藤 花子','研究者','利用中'],['田中 太郎','プロジェクト管理者','利用中'],['研究室管理者','システム管理者','利用中']]);
if(state.page==='projects')h=head('資料と利用者の管理単位')+table(['プロジェクト','共有資料','所属者'],[['薄膜プロジェクト','1,240件','12人'],['文献調査プロジェクト','320件','5人']]);
if(state.page==='history')h=head('本人の調査履歴')+table(['調査','参照範囲','更新'],[['<button class="tablelink" data-page="chat">成膜条件AとBの比較</button>','共有資料＋個人資料','今日 10:42'],['<button class="tablelink" data-page="chat">膜厚の測定方法</button>','共有資料','昨日 16:20']]);
if(state.page==='audit')h=head('管理操作と処理結果の記録')+table(['時刻','操作','結果'],[['10:42','資料の索引更新','完了'],['10:00','共有保存先の取り込み開始','受付'],['09:50','プロジェクトの権限更新','完了']])+'<p class="footnote">会話本文・接続資格情報はこの一覧には記録しない設計です。</p>';
if(state.page==='retention')h=head('原本・履歴・派生情報の保持を管理')+'<div class="section"><h2>原本</h2><p>保存先の原本と、解析用に一時保存する複製を分けて扱います。</p></div><div class="section"><h2>個人の会話・添付</h2><p>保存期間と利用者による削除の範囲は未決定です。</p></div><div class="section"><h2>検索索引・要約・キャッシュ</h2><p>資料の削除・権限変更に追随して更新する設計です。</p></div>';
main.innerHTML=h+(state.toast?'<div class="notice" role="status">'+e(state.toast)+'</div>':'');bind();enhance();
}
state.publicRole='研究者';state.publicScope='薄膜プロジェクト';state.publicPermission='閲覧・チャット参照';state.publicSaved=false;
function enhance(){
 if(state.page==='chat'){
  const form=main.querySelector('#rr-compose');
  form.querySelector('label').remove();form.querySelector('textarea').setAttribute('aria-label','メッセージ');form.querySelector('textarea').placeholder='メッセージを入力';
  form.querySelectorAll(':scope > p,:scope > div.meta').forEach(el=>el.remove());
  const attach=form.querySelector('[data-action=attach]');setIcon(attach,'plus','ファイルを添付');
  form.querySelector('[data-action=sample]').remove();
  const send=form.querySelector('[type=submit]');setIcon(send,'arrow-up','送信');send.classList.add('icon-send');
  form.querySelectorAll('[data-remove]').forEach(b=>setIcon(b,'x',b.getAttribute('aria-label')));
  main.querySelector('.toolbar > span')?.remove();
  main.querySelector('.reading > .notice')?.remove();
  const pagehead=main.querySelector('.pagehead');const fresh=document.createElement('button');fresh.type='button';setIcon(fresh,'square-pen','新しいチャット');fresh.addEventListener('click',()=>{state.question='資料について、どんなことを調べますか？';state.draft='';state.attachments=[];state.chatSent=false;state.excerpt=false;render();});pagehead.append(fresh);
 }
 if(state.page==='roles'){
  const section=document.createElement('section');section.className='publication';section.id='rr-publication';
  section.innerHTML='<h2>資料の公開先をロールで指定</h2><p class="meta">ロールは「誰に」、範囲は「どの資料まで」を指定します。</p><form id="rr-publish"><label class="field">対象資料<input value="成膜条件の比較_2026.pdf" readonly></label><div class="settingsgrid"><label class="field">公開するロール<select id="rr-pub-role">'+['研究者','プロジェクト管理者','閲覧者'].map(r=>'<option'+(r===state.publicRole?' selected':'')+'>'+r+'</option>').join('')+'</select></label><label class="field">適用範囲<select id="rr-pub-scope">'+['薄膜プロジェクト','所属組織全体'].map(v=>'<option'+(v===state.publicScope?' selected':'')+'>'+v+'</option>').join('')+'</select></label></div><label class="field">許可する操作<select id="rr-pub-permission">'+['閲覧・チャット参照','閲覧のみ'].map(v=>'<option'+(v===state.publicPermission?' selected':'')+'>'+v+'</option>').join('')+'</select></label><div id="rr-access-preview" class="role-preview" aria-live="polite"></div><button class="primary" type="submit">公開設定を保存（デモ）</button><p class="meta">個人資料・会話の添付には、この公開設定を自動適用しません。</p></form>';
  main.append(section);
  function preview(){main.querySelector('#rr-access-preview').textContent='公開先：'+state.publicScope+'で「'+state.publicRole+'」を持つ利用者 / '+state.publicPermission+(state.publicSaved?' — デモ上で保存済み':' — 保存前');}
  [['#rr-pub-role','publicRole'],['#rr-pub-scope','publicScope'],['#rr-pub-permission','publicPermission']].forEach(([sel,key])=>main.querySelector(sel).addEventListener('change',ev=>{state[key]=ev.target.value;state.publicSaved=false;preview();}));
  main.querySelector('#rr-publish').addEventListener('submit',ev=>{ev.preventDefault();state.publicSaved=true;preview();});preview();
 }
 if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20,'stroke-width':1.6}});
}
function setIcon(button,name,label){button.classList.add('icon-button','cursor-interaction');button.setAttribute('aria-label',label);button.setAttribute('data-tooltip',label);button.innerHTML='<i data-lucide="'+name+'" aria-hidden="true"></i>';}
let dragDepth=0;
function fileDrag(ev){return Array.from(ev.dataTransfer?.types||[]).includes('Files');}
main.addEventListener('dragenter',ev=>{if(!fileDrag(ev)||state.page!=='chat')return;ev.preventDefault();dragDepth++;main.querySelector('#rr-compose')?.classList.add('drag-active');});
main.addEventListener('dragover',ev=>{if(!fileDrag(ev))return;ev.preventDefault();ev.dataTransfer.dropEffect=state.page==='chat'?'copy':'none';});
main.addEventListener('dragleave',ev=>{if(state.page!=='chat')return;dragDepth=Math.max(0,dragDepth-1);if(dragDepth===0)main.querySelector('#rr-compose')?.classList.remove('drag-active');});
root.addEventListener('drop',ev=>{if(!fileDrag(ev))return;ev.preventDefault();dragDepth=0;if(state.page!=='chat')return;const files=Array.from(ev.dataTransfer.files||[]);if(!files.length){state.toast='ファイルを添付できませんでした。';}else{state.attachments.push(...files.map(f=>f.name));state.toast='';}render();});
function bind(){const scope=main.querySelector('#rr-scope');if(scope)scope.addEventListener('change',()=>{state.scope=scope.value;render();});const draft=main.querySelector('#rr-draft');if(draft)draft.addEventListener('input',()=>state.draft=draft.value);const compose=main.querySelector('#rr-compose');if(compose)compose.addEventListener('submit',ev=>{ev.preventDefault();if(!state.draft.trim()&&!state.attachments.length){state.toast='質問を入力するか、資料を添付してください。';render();return;}state.question=state.draft.trim()||'添付資料を整理して';state.draft='';state.chatSent=true;state.toast='';render();});const files=main.querySelector('#rr-files');if(files)files.addEventListener('change',()=>{state.attachments.push(...Array.from(files.files,f=>f.name));render();});const filter=main.querySelector('#rr-filter');if(filter)filter.addEventListener('input',()=>{main.querySelectorAll('tbody tr').forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(filter.value.toLowerCase()));});const mf=main.querySelector('#rr-model');if(mf)mf.addEventListener('submit',ev=>{ev.preventDefault();state.mode=main.querySelector('#rr-modelmode').value;state.toast='デモ上で処理先を保存しました。実際の接続設定は変更していません。';render();});const cf=main.querySelector('#rr-connect');if(cf)cf.addEventListener('submit',ev=>{ev.preventDefault();state.toast='接続確認の例：対象一覧を確認後、取り込みへ進みます。実際の接続は行っていません。';render();});const role=main.querySelector('#rr-role');if(role)role.addEventListener('change',()=>{state.role=role.value;render();});}
root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;state.toast='';state.excerpt=false;render();remember();return;}if(b.dataset.remove!==undefined){state.attachments.splice(Number(b.dataset.remove),1);render();return;}switch(b.dataset.action){case 'attach':main.querySelector('#rr-files').click();return;case 'sample':state.attachments.push('測定結果_比較.pdf');break;case 'excerpt':case 'file':state.excerpt=!state.excerpt;break;case 'pause':state.paused=!state.paused;break;case 'complete':state.done=true;state.paused=false;break;case 'connection':state.connection=!state.connection;break;case 'personalAdd':state.toast='個人資料の追加例：本人のみ参照できる領域へ登録します。';break;case 'advance':state.toast='待機していた対話を処理開始しました（デモ）。';break;default:return;}render();});
window.addEventListener('openai:set_globals',ev=>{const saved=ev.detail?.globals?.widgetState?.privateContent;if(saved&&typeof saved.closed==='boolean'){state.closed=saved.closed;sidebar();}});
sidebar();render();
const styleState={spacing:30};if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.app'),onChange:()=>main.style.paddingLeft=main.style.paddingRight=styleState.spacing+'px'});tweak.addSlider(styleState,'spacing',{label:'本文の左右余白',min:16,max:40,step:2,unit:'px'});}
})();
</script>
